name: Docs

# copied and adapted from https://fsprojects.github.io/FSharp.Formatting/zero-to-hero.html#Ship-it

# Build the docs on pull requests too, so that a broken docs build fails before the merge.
# Deploy only when new code is pushed to the main branch.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Make sure only one documentation build/deploy runs at a time.
# New pushes to main cancel any in-progress run to avoid concurrent deployments.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          # 10.x SDK to build, 8.x runtime for the net8.0 tools
          dotnet-version: |
            8.x
            10.x


      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build code to make xml file
        # this also copies README.md to Docs/index.md, see the CopyReadmeToDocs target in the fsproj
        run: dotnet build -c Release # see required xml tags: https://fsprojects.github.io/FSharp.Formatting/zero-to-hero.html#Generating-API-documentation

      - name: Generate the documentation html
        # for this to work in dotnet-tools.json, rollForward must be set to 'false' for fsdocs-tool
        run: dotnet fsdocs build --clean --strict --properties Configuration=Release --input Docs --output DocsGenerated

      - name: Upload documentation html files
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./DocsGenerated

  # GitHub Actions recommends deploying in a separate job.
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    # We need some permissions to publish to Github Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
