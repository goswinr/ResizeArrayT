name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          # 10.x SDK to build, 8.x runtime to run the net8.0 tests
          dotnet-version: |
            8.x
            10.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests .NET
        run: dotnet run
        working-directory: ./Tests

      # run JS tests:

      - name: Restore .NET tools (Fable)
        run: dotnet tool restore

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.x' # Adjust the version as needed

      - name: Clean Install npm dependencies
        run: npm ci
        working-directory: ./Tests

      - name: Run tests JS
        run: npm test
        working-directory: ./Tests