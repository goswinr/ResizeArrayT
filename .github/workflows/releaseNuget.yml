name: Publish NuGet Package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write # for NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        # 10.x SDK to build, 8.x runtime to run the net8.0 tests
        dotnet-version: |
          8.x
          10.x

    # the tag may point to any commit, so don't rely on the test runs on main:

    - name: Run tests .NET
      run: dotnet run --configuration Release
      working-directory: ./Tests

    - name: Restore .NET tools (Fable)
      run: dotnet tool restore

    - name: Setup Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '24.x'

    - name: Clean Install npm dependencies
      run: npm ci
      working-directory: ./Tests

    - name: Run tests JS
      run: npm test
      working-directory: ./Tests

    - name: Replace <br> in README.md with two spaces for nuget.org
      run: |
        $content = Get-Content -Path README.md -Raw
        $content = $content -replace "<br>", "  "
        Set-Content -Path README.md -Value $content    

    - name: Build
      run: dotnet build --configuration Release

    - name: Check version consistency of git tag and CHANGELOG.md
      # needs in fsproj:
      # <Target Name="WriteChangelogVersion" AfterTargets="AfterBuild"><!-- for version checks in github tag based builds -->
      #   <WriteLinesToFile File="./bin/ChangelogVersion.txt" Lines="@(CurrentReleaseChangelog)" Overwrite="true" ContinueOnError="false" />
      # </Target>
      id: check_version
      shell: bash
      run: |
        CHANGELOG_VERSION=$(cat ./Src/bin/ChangelogVersion.txt | tr -d '[:space:]')
        echo "CHANGELOG_VERSION=$CHANGELOG_VERSION"
        echo "github.ref_name=${{ github.ref_name }}"  
        if [ "${{ github.ref_name }}" != "$CHANGELOG_VERSION" ]; then
          echo "Version mismatch: git tag (${{ github.ref_name }}) and version in CHANGELOG.md ($CHANGELOG_VERSION) are not the same."
          exit 1
        fi

    # Trusted publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key.
    # Needs a trusted publishing policy on nuget.org for this repository and workflow file (releaseNuget.yml).
    # The user is the public nuget.org profile name (not the email address), so it does not need to be a secret.
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: goswinr

    - name: Publish NuGet package
      run: |
        $nupkgPath = Get-ChildItem -Path "./Src/bin/Release/" -Filter "*.nupkg" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        if (-not $nupkgPath) {
          Write-Error "No .nupkg file found in ./Src/bin/Release/ folder."
          exit 1
        }
        dotnet nuget push $nupkgPath --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json